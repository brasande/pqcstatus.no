# Lokal kjøring:
#   docker compose run --rm scanner        # hent domener og skann (LIMIT=50 for rask test)
#   docker compose up -d web               # åpne http://localhost:8088 (PORT=… for annen port)
services:
  scanner:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command: ["kvantesjekk domains && kvantesjekk scan -limit ${LIMIT:-0}"]
    volumes:
      - ./data:/app/data
      - ./site/data:/app/site/data
    profiles: ["scan"]

  web:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${PORT:-8088}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
