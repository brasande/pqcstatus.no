server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Nettleseren skal alltid sjekke om filene er endret (ETag), så nye
    # versjoner av siden og dataene vises uten hard oppdatering.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
